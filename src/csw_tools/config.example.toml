[common]

## Base service name used for passwords stored by csw-tools in the keyring.
## Modifying this is advanced usage and is typically not needed.
# keyring_service_name = "csw-tools"

## Secure Workload (formerly Tetration) dashboard used for API calls.
## Accepted formats:
##   URL:  https://my-company.tetrationcloud.com
##   FQDN: my-company.tetrationcloud.com
##   Name: my-company
##   On-premises: https://csw.example.org (explicit HTTPS URL required)
# dashboard = ""

## Verify the dashboard TLS certificate.
## Set to false only when certificate verification must be bypassed.
# dashboard_verify_tls = true

[clean-stale-labels]
# minimum_age = 30
# page_size = 500

[convert-labels]
# labels = ["hostname", "os"]
# page_size = 500

[create-scopes]

[prune-agents]
# page_size = 500
# backup_dir = "csw-tools-backups"
## Defaults to dry-run with individual confirmation when --apply is supplied.
## Agent deletion is destructive and cannot be rolled back.
## lastdate is an optional Unix epoch cutoff in seconds; omitted = 30 days ago.


[prune-policy]


[sync-collection-rules]
